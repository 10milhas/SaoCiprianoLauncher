plugins { id 'com.android.application' }

android {
    namespace 'br.com.saocipriano.launcher'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.saocipriano.launcher'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.15.0'
}
